name: Deploy Production

on:
  workflow_run:
    workflows:
      - Publish Image
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy-production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      
      # ECR Public Configuration
      ECR_PUBLIC_REGISTRY: public.ecr.aws/b6x6o4z7/sun-pub

      # VM Configuration
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}

    steps:
      - name: Select image tag
        id: image-tag
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            image_tag="${{ inputs.image_tag }}"
          else
            short_sha="$(printf '%s' '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
            image_tag="sha-${short_sha}"
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "Selected image tag: ${image_tag}"

      - name: Validate AWS credentials
        run: |
          set -euo pipefail

          missing=0

          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ACCOUNT_ID AWS_REGION; do
            if [ -z "${!key:-}" ]; then
              echo "❌ Missing required AWS credential: ${key}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 1 ]; then
            echo "Please provide all required AWS credentials in GitHub Secrets."
            exit 1
          fi

          echo "✅ AWS credentials validated successfully."
          echo "ECR Public Registry: ${ECR_PUBLIC_REGISTRY}"

      - name: Load runtime secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          for key in POSTGRES_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            value="${!key}"
            if [ -n "${value}" ]; then
              echo "::add-mask::${value}"
              printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_ENV}"
            fi
          done

      - name: Validate VM settings
        run: |
          set -euo pipefail

          missing=0

          for key in VM_HOST VM_USER VM_APP_DIR VM_SSH_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "❌ Missing VM setting: ${key}"
              missing=1
            fi
          done

          if [ "${missing}" -eq 1 ]; then
            echo "Please add missing VM secrets."
            exit 1
          fi

          echo "✅ VM settings validated."

      - name: Deploy selected tag to VM
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_PUBLIC_REGISTRY: ${{ env.ECR_PUBLIC_REGISTRY }}
        run: |
          set -euo pipefail

          echo "🚀 Starting deployment to VM..."
          echo "AWS Region: ${AWS_REGION}"
          echo "AWS Account ID: ${AWS_ACCOUNT_ID}"
          echo "ECR Public Registry: ${ECR_PUBLIC_REGISTRY}"
          echo "Image Tag: ${IMAGE_TAG}"

          key_file="${RUNNER_TEMP}/vm-deploy-key.pem"
          ssh_config_file="${RUNNER_TEMP}/vm-ssh-config"

          # Use raw SSH key directly
          printf '%s\n' "${VM_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          ssh-keygen -y -f "${key_file}" >/dev/null

          cat > "${ssh_config_file}" <<EOF
          Host vm-target
            HostName ${VM_HOST}
            User ${VM_USER}
            IdentityFile ${key_file}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          echo "🔌 Testing SSH connection..."
          ssh -F "${ssh_config_file}" vm-target "echo ✅ SSH OK"

          echo "📦 Deploying image: ${ECR_PUBLIC_REGISTRY}:${IMAGE_TAG}"
          ssh -F "${ssh_config_file}" vm-target <<EOF
          set -euo pipefail
          
          export IMAGE_TAG='${IMAGE_TAG}'
          export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
          export GRAFANA_ADMIN_PASSWORD='${GRAFANA_ADMIN_PASSWORD}'
          export AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}'
          export AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}'
          export AWS_ACCOUNT_ID='${AWS_ACCOUNT_ID}'
          export AWS_REGION='${AWS_REGION}'
          export ECR_PUBLIC_REGISTRY='${ECR_PUBLIC_REGISTRY}'
          
          cd '${VM_APP_DIR}'
          
          # Login to ECR Public
          echo "🔐 Logging in to ECR Public..."
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ECR_PUBLIC_REGISTRY}
          
          # Pull the image
          echo "📥 Pulling image: ${ECR_PUBLIC_REGISTRY}:${IMAGE_TAG}"
          docker pull ${ECR_PUBLIC_REGISTRY}:${IMAGE_TAG}
          
          # Run deployment script
          echo "🚀 Running deployment script..."
          bash deploy/deploy.sh '${IMAGE_TAG}'
          EOF

          echo "✅ Deployment completed successfully!"
