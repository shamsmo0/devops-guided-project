name: Publish Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_PUBLIC_REGISTRY: public.ecr.aws/b6x6o4z7/sun-pub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # ECR Public uses us-east-1

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          
          # Build the image
          docker build -t ${ECR_PUBLIC_REGISTRY}:${IMAGE_TAG} .
          
          # Push to ECR Public
          docker push ${ECR_PUBLIC_REGISTRY}:${IMAGE_TAG}
          
          # Also tag as latest
          docker tag ${ECR_PUBLIC_REGISTRY}:${IMAGE_TAG} ${ECR_PUBLIC_REGISTRY}:latest
          docker push ${ECR_PUBLIC_REGISTRY}:latest

      - name: Get short SHA
        id: short-sha
        run: |
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Output image info
        run: |
          echo "✅ Image published to ECR Public:"
          echo "Registry: ${ECR_PUBLIC_REGISTRY}"
          echo "Tag: ${{ github.sha }}"
          echo "Short SHA: ${{ steps.short-sha.outputs.short_sha }}"
