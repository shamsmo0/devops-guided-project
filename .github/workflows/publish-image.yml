name: Publish Image

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
id-token: write

env:
AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
AWS_REGION: us-east-1
ECR_REGISTRY: public.ecr.aws
IMAGE_NAME: b6x6o4z7/sun-pub

jobs:
build-and-publish:
name: build-and-publish
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Validate AWS credentials
    run: |
      set -euo pipefail

      for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
        if [ -z "${!key:-}" ]; then
          echo "❌ Missing AWS credential: $key"
          exit 1
        fi
      done

      echo "✅ AWS credentials validated successfully"

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: us-east-1

  - name: Login to Amazon ECR Public
    uses: aws-actions/amazon-ecr-login@v2
    with:
      registry-type: public

  - name: Set image tag
    id: image-tag
    run: |
      set -euo pipefail

      SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

      if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
        IMAGE_TAG="sha-${SHORT_SHA}"
      else
        IMAGE_TAG="${SHORT_SHA}"
      fi

      echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  - name: Debug repository structure
    run: |
      pwd
      echo "===== ROOT ====="
      ls -la

      echo "===== DOCKER DIR ====="
      ls -la docker || true

      echo "===== FIND DOCKERFILES ====="
      find . -name "*Dockerfile*" -type f

  - name: Build Docker image
    run: |
      set -euo pipefail

      IMAGE_URI="${ECR_REGISTRY}/${IMAGE_NAME}:${{ steps.image-tag.outputs.image_tag }}"

      echo "🏗️ Building using docker/app.Dockerfile"

      test -f docker/app.Dockerfile

      docker build \
        --file docker/app.Dockerfile \
        --tag "$IMAGE_URI" \
        .

      docker tag "$IMAGE_URI" "${ECR_REGISTRY}/${IMAGE_NAME}:latest"

      echo "✅ Build completed"

  - name: Push to ECR Public
    run: |
      set -euo pipefail

      IMAGE_URI="${ECR_REGISTRY}/${IMAGE_NAME}:${{ steps.image-tag.outputs.image_tag }}"

      echo "📤 Pushing $IMAGE_URI"

      docker push "$IMAGE_URI"
      docker push "${ECR_REGISTRY}/${IMAGE_NAME}:latest"

      echo "✅ Push completed"

  - name: Output image info
    run: |
      echo "===================================="
      echo "✅ IMAGE PUBLISHED SUCCESSFULLY"
      echo "Repo: ${ECR_REGISTRY}/${IMAGE_NAME}"
      echo "Tag: ${{ steps.image-tag.outputs.image_tag }}"
      echo "Dockerfile: docker/app.Dockerfile"
      echo "===================================="
