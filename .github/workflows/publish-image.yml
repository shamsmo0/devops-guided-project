name: Publish Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_PUBLIC_REGISTRY: public.ecr.aws/b6x6o4z7/sun-pub
  IMAGE_NAME: sun-pub

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS credentials
        run: |
          set -euo pipefail
          
          missing=0
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ACCOUNT_ID AWS_REGION; do
            if [ -z "${!key:-}" ]; then
              echo "❌ Missing required AWS credential: ${key}"
              missing=1
            fi
          done
          
          if [ "${missing}" -eq 1 ]; then
            echo "Please provide all required AWS credentials in GitHub Secrets."
            exit 1
          fi
          
          # Clean credentials (remove any whitespace)
          echo "Cleaning AWS credentials..."
          export AWS_ACCESS_KEY_ID=$(echo "$AWS_ACCESS_KEY_ID" | tr -d '\r\n' | xargs)
          export AWS_SECRET_ACCESS_KEY=$(echo "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n' | xargs)
          
          echo "✅ AWS credentials validated successfully."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # ECR Public requires us-east-1

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set image tag
        id: image-tag
        run: |
          set -euo pipefail
          
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IMAGE_TAG="sha-${SHORT_SHA}"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi
          
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "${GITHUB_OUTPUT}"
          echo "Selected image tag: ${IMAGE_TAG}"

      - name: Build Docker image
        run: |
          set -euo pipefail
          
          echo "🏗️ Building Docker image..."
          echo "Registry: ${ECR_PUBLIC_REGISTRY}"
          echo "Tag: ${{ steps.image-tag.outputs.image_tag }}"
          
          docker build -t ${ECR_PUBLIC_REGISTRY}:${{ steps.image-tag.outputs.image_tag }} .
          docker tag ${ECR_PUBLIC_REGISTRY}:${{ steps.image-tag.outputs.image_tag }} ${ECR_PUBLIC_REGISTRY}:latest
          
          echo "✅ Image built successfully"

      - name: Push to ECR Public
        run: |
          set -euo pipefail
          
          echo "📤 Pushing image to ECR Public..."
          echo "Pushing: ${ECR_PUBLIC_REGISTRY}:${{ steps.image-tag.outputs.image_tag }}"
          
          # Push with retry logic
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            if docker push ${ECR_PUBLIC_REGISTRY}:${{ steps.image-tag.outputs.image_tag }}; then
              echo "✅ Push succeeded!"
              break
            else
              echo "⚠️ Push failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          # Push latest tag
          echo "Pushing latest tag..."
          docker push ${ECR_PUBLIC_REGISTRY}:latest
          
          echo "✅ Image pushed successfully"

      - name: Output image info
        run: |
          set -euo pipefail
          
          echo "=========================================="
          echo "✅ Image published to ECR Public!"
          echo "=========================================="
          echo "Registry: ${ECR_PUBLIC_REGISTRY}"
          echo "Image Tag: ${{ steps.image-tag.outputs.image_tag }}"
          echo "Short SHA: ${{ steps.image-tag.outputs.short_sha }}"
          echo "Latest Tag: ${ECR_PUBLIC_REGISTRY}:latest"
          echo "=========================================="
